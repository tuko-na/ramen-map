name: Update Ramen Master Data

on:
  schedule:
    - cron: '0 15 * * *' # 毎日日本時間 24:00 実行
  workflow_dispatch:

permissions:
  contents: write # リポジトリへの commit & push 権限を明示

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/pipeline/index.js
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Commit and Push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/ramen-shops.json public/data/review-queue.json
          git diff --quiet && git diff --staged --quiet && exit 0
          git commit -m "auto: update ramen master data & review queue"
          # pull-rebase + リトライ（手元CLIとの競合対策）
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push failed (attempt $i/3). Retrying in 5s..."
            sleep 5
          done
          echo "Push failed after 3 attempts." >&2
          exit 1

